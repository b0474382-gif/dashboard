<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطبيب - إدارة العيادة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f3f4f6; padding: 20px; color: #1f2937; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e3a8a; color: white; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        h1 { font-size: 22px; font-weight: 700; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr 3fr; gap: 20px; }
        @media(max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
        
        /* القسم الجانبي للإعدادات */
        .sidebar-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: fit-content; }
        .sidebar-card h3 { color: #1e3a8a; margin-bottom: 15px; font-size: 16px; border-bottom: 2px solid #f3f4f6; padding-bottom: 5px; }
        .form-control { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; }
        input, select, button { width: 100%; padding: 10px; border: 1.5px solid #e5e7eb; border-radius: 6px; font-size: 14px; }
        button { background: #10b981; color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button:hover { background: #059669; }
        .btn-danger-custom { background: #ef4444; }
        .btn-danger-custom:hover { background: #dc2626; }

        /* جدول الحجوزات والمواعيد */
        .main-content { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #edf2f7; font-size: 14px; }
        th { background-color: #f8fafc; color: #475569; font-weight: 700; }
        
        /* الحالات الأكشن الأزرار */
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-confirmed { background: #dbeafe; color: #2563eb; }
        .badge-done { background: #d1fae5; color: #065f46; }
        .badge-canceled { background: #fee2e2; color: #991b1b; }
        
        .action-btns { display: flex; gap: 5px; }
        .btn-act { padding: 6px 10px; border: none; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; color: white; width: auto; }
        .btn-confirm { background: #3b82f6; }
        .btn-done { background: #10b981; }
        .btn-delay { background: #f59e0b; }
        .btn-cancel { background: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>لوحة تحكم إدارة الحجوزات الطبية ومواعيد العيادة</h1>
        <div>أهلاً دكتور | لوحة تحكم فورية</div>
    </header>

    <div class="grid-layout">
        <!-- لوحة التحكم في الإجازات والأوقات المقفلة -->
        <div class="sidebar-card">
            <h3>📴 إدارة الإجازات والتعطيل</h3>
            <div class="form-control">
                <label>تحديد يوم إجازة كامل للعيادة</label>
                <input type="date" id="vacationDate">
            </div>
            <button onclick="setOffDay()" style="margin-bottom: 20px;">تعطيل هذا اليوم بالكامل</button>

            <h3>🔒 قفل توقيت معين بيوم محدد</h3>
            <div class="form-control">
                <label>اختر التاريخ</label>
                <input type="date" id="lockDate">
            </div>
            <div class="form-control">
                <label>اختر الوقت المراد قفله</label>
                <select id="lockTime">
                    <option value="04:00 مساءً">04:00 مساءً</option>
                    <option value="04:30 مساءً">04:30 مساءً</option>
                    <option value="05:00 مساءً">05:00 مساءً</option>
                    <option value="05:30 مساءً">05:30 مساءً</option>
                    <option value="06:00 مساءً">06:00 مساءً</option>
                    <option value="06:30 مساءً">06:30 مساءً</option>
                    <option value="07:00 مساءً">07:00 مساءً</option>
                    <option value="07:30 مساءً">07:30 مساءً</option>
                </select>
            </div>
            <button class="btn-danger-custom" onclick="setBlockedSlot()">قفل هذا الوقت فقط</button>
        </div>

        <!-- جدول المواعيد القادمة -->
        <div class="main-content">
            <h3>📅 كشف الحجوزات الحالية</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>المريض</th>
                            <th>رقم الهاتف</th>
                            <th>التاريخ والوقت</th>
                            <th>الحالة</th>
                            <th>إجراءات التحكم للعيادة</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTableBody">
                        <!-- البيانات ستظهر هنا ديناميكياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // جلب وحفظ إعدادات القفل والإجازات
    let settings = JSON.parse(localStorage.getItem('clinic_settings')) || { offDays: [], blockedSlots: [] };

    function setOffDay() {
        const date = document.getElementById('vacationDate').value;
        if(date) {
            settings.offDays.push(date);
            localStorage.setItem('clinic_settings', JSON.stringify(settings));
            alert('تم تعيين اليوم كإجازة بنجاح، ولن يتمكن أي مريض من حجز موعد فيه.');
        }
    }

    function setBlockedSlot() {
        const date = document.getElementById('lockDate').value;
        const time = document.getElementById('lockTime').value;
        if(date && time) {
            settings.blockedSlots.push(`${date}T${time}`);
            localStorage.setItem('clinic_settings', JSON.stringify(settings));
            alert(`تم قفل التوقيت ${time} في تاريخ ${date} بنجاح.`);
        }
    }

    // عرض وإدارة المواعيد المستلمة
    function loadAppointments() {
        const appointments = JSON.parse(localStorage.getItem('clinic_appointments')) || [];
        const tbody = document.getElementById('appointmentsTableBody');
        tbody.innerHTML = '';

        if(appointments.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#9ca3af;">لا توجد أي حجوزات مسجلة بعد.</td></tr>`;
            return;
        }

        appointments.forEach(app => {
            let badgeClass = 'badge-pending';
            if (app.status === 'مؤكد') badgeClass = 'badge-confirmed';
            if (app.status === 'تمت الزيارة') badgeClass = 'badge-done';
            if (app.status === 'ملغي' || app.status === 'مؤجل') badgeClass = 'badge-canceled';

            tbody.innerHTML += `
                <tr>
                    <td><strong>${app.name}</strong></td>
                    <td>${app.phone}</td>
                    <td>${app.date} | <span style="color:#2563eb; font-weight:600;">${app.time}</span></td>
                    <td><span class="badge ${badgeClass}">${app.status}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-act btn-confirm" onclick="updateStatus(${app.id}, 'مؤكد')">تأكيد</button>
                            <button class="btn-act btn-done" onclick="updateStatus(${app.id}, 'تمت الزيارة')">إنهاء الزيارة</button>
                            <button class="btn-act btn-delay" onclick="delayAppointment(${app.id})">تأخير</button>
                            <button class="btn-act btn-cancel" onclick="updateStatus(${app.id}, 'ملغي')">إلغاء</button>
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    function updateStatus(id, newStatus) {
        let appointments = JSON.parse(localStorage.getItem('clinic_appointments')) || [];
        appointments = appointments.map(app => app.id === id ? { ...app, status: newStatus } : app);
        localStorage.setItem('clinic_appointments', JSON.stringify(appointments));
        loadAppointments();
    }

    function delayAppointment(id) {
        const newTime = prompt("أدخل التوقيت الجديد للمريض (مثال: 07:00 مساءً):");
        if(newTime) {
            let appointments = JSON.parse(localStorage.getItem('clinic_appointments')) || [];
            appointments = appointments.map(app => app.id === id ? { ...app, time: newTime, status: 'مؤجل' } : app);
            localStorage.setItem('clinic_appointments', JSON.stringify(appointments));
            loadAppointments();
        }
    }

    // تحديث فوري تلقائي عند فتح الصفحتين معاً بالمتصفح بجوار بعضهما
    window.addEventListener('storage', function(e) {
        if (e.key === 'new_booking_trigger') {
            loadAppointments();
            // تشغيل صوت تنبيه فوري
            let audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-84.wav');
            audio.play().catch(e => console.log("Audio play blocked"));
        }
    });

    // تحميل البيانات لأول مرة
    window.onload = loadAppointments;
</script>

</body>
</html>
